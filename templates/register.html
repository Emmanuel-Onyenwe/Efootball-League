<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Panic Keh | Register</title>
    <style>
        body { background-color: #0A0E1A; color: #F2F5FA; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #10162C; padding: 40px; border-radius: 12px; border-top: 4px solid #00E5FF; text-align: center; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin: 10px 0 20px; background: #1B2340; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box;}
        button { width: 100%; padding: 12px; background: linear-gradient(90deg, #00E5FF, #FF2E9A); border: none; color: black; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="font-family: 'Orbitron', sans-serif; margin-top:0;">REGISTER Gamertag</h2>
        <form method="POST">
            <label style="display:block; text-align:left; font-size: 0.8rem; color:#A8B2D1;">GAMERTAG</label>
            <input type="text" name="gamertag" required>
            <label style="display:block; text-align:left; font-size: 0.8rem; color:#A8B2D1;">PASSWORD</label>
            <input type="password" name="password" required>
            <button type="submit">JOIN LEAGUE</button>
        </form>
        <p style="margin-top: 20px; font-size: 0.8rem;"><a href="/login" style="color: #00E5FF; text-decoration: none;">Already have an account? Log in</a></p>
    </div>
</body>
</html>
