<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panic Keh | Forgot Password</title>
    <style>
        body { background-color: #0A0E1A; color: #F2F5FA; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #10162C; padding: 40px; border-radius: 12px; border-top: 4px solid #FFC93C; text-align: center; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin: 10px 0 20px; background: #1B2340; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box;}
        button { width: 100%; padding: 12px; background: linear-gradient(90deg, #FFC93C, #FF2E9A); border: none; color: black; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="font-family: 'Orbitron', sans-serif; margin-top:0;">RECOVER ACCOUNT</h2>
        <p style="font-size: 0.85rem; color: #A8B2D1; margin-bottom: 20px;">Enter your email to receive a password reset link.</p>
        
        <!-- We use Flash messages here to confirm the email was sent -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
              <div style="padding: 10px; background: #33E6A0; color: black; border-radius: 5px; margin-bottom: 15px; font-size: 0.85rem;">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <label style="display:block; text-align:left; font-size: 0.8rem; color:#A8B2D1;">EMAIL ADDRESS</label>
            <input type="email" name="email" required>
            <button type="submit">SEND RESET LINK</button>
        </form>
        <p style="margin-top: 20px; font-size: 0.8rem;"><a href="/login" style="color: #FFC93C; text-decoration: none;">&larr; Back to Login</a></p>
    </div>
</body>
</html>
